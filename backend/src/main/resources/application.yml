server:
  port: 8080

spring:
  application:
    name: ai-shopping-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_shop
    username: ai_shop
    password: ai_shop
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    access-token-secret: "aishop-access-token-secret-key-32chars!!"
    access-token-expiration-sec: 7200
    refresh-token-secret: "aishop-refresh-token-secret-key-32chars!!"
    refresh-token-expiration-sec: 604800
  internal-token: dev-internal-token
  ai-service:
    base-url: http://localhost:8001/internal/v1/ai
    connect-timeout-ms: 1000
    read-timeout-ms: 3000
