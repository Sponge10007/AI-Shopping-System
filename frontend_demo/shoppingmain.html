<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shopping - Immersive Home</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #1d1d1f;
            scroll-behavior: smooth;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        /* 重点：Apple 风格的大展框 */
        .hero-card {
            background: #f5f5f7;
            border-radius: 32px;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .hero-card:hover {
            transform: scale(1.01);
        }

        /* AI 搜索组件极致化 */
        .ai-search-container {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 22px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }

        .product-card {
            border-radius: 24px;
            background: #ffffff;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover {
            box-shadow: 0 30px 60px rgba(0,0,0,0.08);
            transform: translateY(-8px);
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .text-balanced { text-wrap: balance; }
        
        /* 渐变装饰 */
        .ai-gradient-text {
            background: linear-gradient(90deg, #0071e3, #5e5ce6, #ff375f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-white">
    <div id="app">
        <nav class="glass-nav fixed top-0 w-full z-50">
            <div class="max-w-[1200px] mx-auto px-6 h-14 flex justify-between items-center">
                <div class="flex items-center space-x-10">
                    <div class="text-xl font-bold tracking-tight cursor-pointer">AI <span class="font-light">Store</span></div>
                    <div class="hidden md:flex space-x-8 text-[13px] font-medium text-gray-600">
                        <a href="#" class="hover:text-black transition">智能选购</a>
                        <a href="#" class="hover:text-black transition">新品</a>
                        <a href="#" class="hover:text-black transition">配件</a>
                        <a href="#" class="hover:text-black transition">服务</a>
                    </div>
                </div>
                <div class="flex items-center space-x-6">
                    <svg class="w-5 h-5 cursor-pointer hover:opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <svg class="w-5 h-5 cursor-pointer hover:opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                </div>
            </div>
        </nav>

        <main class="pt-20 pb-32">
            <section class="max-w-[1200px] mx-auto px-6 mb-16">
                <div class="hero-card relative min-h-[500px] flex flex-col items-center justify-center text-center p-10">
                    <div class="z-10 max-w-2xl">
                        <span class="inline-block px-4 py-1 rounded-full bg-white/50 text-[12px] font-bold tracking-widest text-blue-600 mb-6 uppercase">New Intelligence</span>
                        <h1 class="text-5xl md:text-6xl font-bold tracking-tight mb-8 text-balanced">
                            遇见你的下一件 <span class="ai-gradient-text">心仪之物。</span>
                        </h1>
                        
                        <div class="ai-search-container p-2 flex items-center space-x-3">
                            <div class="flex-grow flex items-center pl-4">
                                <span class="text-blue-500 mr-2">✦</span>
                                <input type="text" v-model="searchQuery" 
                                       placeholder="用一句话描述你想要的..." 
                                       class="bg-transparent border-none w-full focus:outline-none text-lg py-3">
                            </div>
                            <div class="flex items-center space-x-1 pr-2">
                                <button class="p-3 text-gray-400 hover:bg-gray-100 rounded-xl transition" title="视觉识图">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                </button>
                                <button @click="handleSearch" class="bg-black text-white px-6 py-3 rounded-xl font-medium hover:bg-gray-800 transition">
                                    搜索
                                </button>
                            </div>
                        </div>
                        <p class="mt-6 text-sm text-gray-500">试着说： “适合在海边穿的极简风连衣裙”</p>
                    </div>
                    
                    <div class="absolute inset-0 z-0 opacity-40">
                        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-200 rounded-full blur-[120px]"></div>
                        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-200 rounded-full blur-[120px]"></div>
                    </div>
                </div>
            </section>

            <section class="max-w-[1200px] mx-auto px-6 mb-16 overflow-x-auto no-scrollbar">
                <div class="flex space-x-4 min-w-max">
                    <div v-for="cat in ['全部', '数码周边', '家居美学', '穿搭灵感', '户外运动', '办公好物']" 
                         class="px-8 py-4 bg-[#f5f5f7] rounded-full text-sm font-medium cursor-pointer hover:bg-gray-200 transition">
                        {{ cat }}
                    </div>
                </div>
            </section>

            <section class="max-w-[1200px] mx-auto px-6">
                <div class="flex items-baseline justify-between mb-8">
                    <h2 class="text-3xl font-bold tracking-tight">AI 智能发现</h2>
                    <span class="text-sm text-gray-500 font-medium italic">基于您的偏好实时生成</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 product-card bg-gray-900 text-white overflow-hidden flex flex-col md:flex-row">
                        <div class="p-10 flex flex-col justify-center w-full md:w-1/2">
                            <span class="text-blue-400 text-xs font-bold uppercase tracking-widest mb-4">今日焦点</span>
                            <h3 class="text-3xl font-bold mb-4">下一代音频体验</h3>
                            <p class="text-gray-400 text-sm mb-8 leading-relaxed">AI 会根据您的听歌习惯，自动为您匹配最合适的声学配置。</p>
                            <div>
                                <button class="bg-white text-black px-6 py-2.5 rounded-full text-sm font-bold">了解详情</button>
                            </div>
                        </div>
                        <div class="bg-gradient-to-br from-gray-800 to-black w-full md:w-1/2 min-h-[300px] flex items-center justify-center">
                            <span class="text-gray-600 font-bold">HEADPHONE IMAGE</span>
                        </div>
                    </div>

                    <div v-for="i in 4" :key="i" class="product-card p-4 border border-gray-100">
                        <div class="aspect-square bg-[#f5f5f7] rounded-2xl mb-4 flex items-center justify-center">
                            <span class="text-gray-300 font-bold">PRODUCT {{i}}</span>
                        </div>
                        <div class="px-2">
                            <div class="flex items-center space-x-2 mb-2">
                                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                                <span class="text-[11px] font-bold text-gray-400 uppercase">AI 匹配度 98%</span>
                            </div>
                            <h4 class="font-semibold text-lg mb-1 tracking-tight">极简工业风台灯 {{i}}</h4>
                            <p class="text-gray-500 text-sm mb-4">符合您的空间美学偏好</p>
                            <div class="flex justify-between items-center border-t pt-4">
                                <span class="text-xl font-semibold">¥899</span>
                                <button class="w-10 h-10 rounded-full bg-[#f5f5f7] flex items-center justify-center hover:bg-black hover:text-white transition">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50">
            <div class="bg-black/90 backdrop-blur-xl text-white px-6 py-3 rounded-full flex items-center space-x-4 shadow-2xl border border-white/10">
                <div class="relative">
                    <div class="w-2 h-2 bg-blue-500 rounded-full animate-ping absolute"></div>
                    <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
                </div>
                <span class="text-sm font-medium">AI 正在根据您的浏览实时分析...</span>
                <div class="h-4 w-[1px] bg-white/20"></div>
                <button class="text-sm font-bold text-blue-400 hover:text-blue-300">打开对话</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const searchQuery = ref('');
                const handleSearch = () => {
                    if(searchQuery.value) alert('AI 正在深度搜索: ' + searchQuery.value);
                };
                return { searchQuery, handleSearch };
            }
        }).mount('#app')
    </script>
</body>
</html>
