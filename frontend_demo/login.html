<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shopping System - Premium Login</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            overflow: hidden; /* 防止背景动画导致溢出 */
        }

        /* 弥散渐变背景 (Mesh Gradient) */
        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f5f5f7;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 113, 227, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(94, 92, 230, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 55, 95, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(48, 209, 88, 0.1) 0px, transparent 50%);
            z-index: -1;
        }

        /* 极致毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: saturate(180%) blur(30px);
            -webkit-backdrop-filter: saturate(180%) blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
        }

        /* 苹果风格输入框 */
        .apple-input {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #1d1d1f;
        }

        .apple-input:focus {
            background: #ffffff;
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
            outline: none;
        }

        /* 渐变文字 */
        .text-gradient {
            background: linear-gradient(135deg, #0071e3 0%, #5e5ce6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 按钮微交互 */
        .btn-primary {
            background: #1d1d1f;
            color: white;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            background: #000;
        }

        /* 动画 */
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="mesh-gradient"></div>

        <div class="flex items-center justify-center min-h-screen p-6">
            <div class="w-full max-w-md glass-card p-10 fade-in">
                
                <div class="text-center mb-10">
                    <div class="w-16 h-16 bg-white rounded-2xl shadow-sm mx-auto mb-6 flex items-center justify-center">
                        <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                        </svg>
                    </div>
                    <h1 class="text-3xl font-semibold tracking-tight text-gray-900">欢迎回来</h1>
                    <p class="text-gray-500 mt-2">使用您的账户以继续</p>
                </div>

                <div class="flex p-1 bg-gray-100/50 rounded-xl mb-8">
                    <button @click="mode = 'login'" 
                            :class="mode === 'login' ? 'bg-white shadow-sm font-medium' : 'text-gray-500'"
                            class="flex-1 py-2 rounded-lg text-sm transition-all">登录</button>
                    <button @click="mode = 'register'" 
                            :class="mode === 'register' ? 'bg-white shadow-sm font-medium' : 'text-gray-500'"
                            class="flex-1 py-2 rounded-lg text-sm transition-all">注册</button>
                </div>
                
                <form @submit.prevent="submit" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1">账号</label>
                        <input type="text" v-model="form.user" placeholder="手机号或用户名" 
                               class="apple-input w-full p-4 rounded-xl text-base">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2 px-1">
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">密码</label>
                            <a href="#" class="text-xs text-blue-600 hover:underline">忘记密码?</a>
                        </div>
                        <div class="relative">
                            <input :type="showPass ? 'text' : 'password'" v-model="form.pass" placeholder="请输入密码" 
                                   class="apple-input w-full p-4 rounded-xl text-base">
                            <button type="button" @click="showPass = !showPass" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition">
                                <span class="text-xs font-medium">{{ showPass ? '隐藏' : '显示' }}</span>
                            </button>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="btn-primary w-full py-4 rounded-2xl font-medium text-lg">
                            {{ mode === 'login' ? '登录' : '创建账户' }}
                        </button>
                    </div>
                </form>

                <div class="mt-10">
                    <div class="relative mb-6">
                        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                        <div class="relative flex justify-center text-xs uppercase"><span class="bg-transparent px-2 text-gray-400">其他登录方式</span></div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <button class="flex items-center justify-center py-3 px-4 border border-gray-200 rounded-xl hover:bg-white transition bg-white/30">
                            <span class="text-sm font-medium">WeChat</span>
                        </button>
                        <button class="flex items-center justify-center py-3 px-4 border border-gray-200 rounded-xl hover:bg-white transition bg-white/30">
                            <span class="text-sm font-medium">Google</span>
                        </button>
                    </div>
                </div>

                <p class="mt-10 text-center text-[11px] text-gray-400 leading-relaxed px-4">
                    登录即表示您同意本系统的 <a href="#" class="text-blue-500 hover:underline">服务协议</a> 与 <a href="#" class="text-blue-500 hover:underline">隐私政策</a>。
                </p>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive } = Vue;
        createApp({
            setup() {
                const mode = ref('login');
                const showPass = ref(false);
                const form = reactive({ user: '', pass: '' });
                const submit = () => {
                    alert('正在进入系统...');
                };
                return { mode, showPass, form, submit };
            }
        }).mount('#app')
    </script>
</body>
</html>
